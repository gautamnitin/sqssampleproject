# Dev profile ? real AWS SQS
# Only essential properties. Do NOT set an endpoint here so the app uses real AWS.
# Credentials are NOT stored here; the app will use either:
# - Explicit credentials from the properties below (sourced from env vars), or
# - The AWS Default Credentials Provider Chain (env, system props, profiles, IAM role)
#
# To provide credentials via environment variables (recommended for dev):
#   set AWS_ACCESS_KEY_ID=...
#   set AWS_SECRET_ACCESS_KEY=...
#   set AWS_SESSION_TOKEN=...   (optional for temporary creds)
# These will be injected into the app.sqs.* properties via placeholders.

# --- SQS ---
app.sqs.region=us-east-1
# Replace with your actual SQS queue name
app.sqs.employee-queue=employee-queue

# --- Optional explicit credentials (read from environment if present) ---
# If set, the app will use these. If empty, it falls back to DefaultCredentialsProvider.
app.sqs.access-key-id=${AWS_ACCESS_KEY_ID:}
app.sqs.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
app.sqs.session-token=${AWS_SESSION_TOKEN:}

# Optional listener tuning (safe defaults). You can override per environment as needed.
spring.cloud.aws.sqs.listener.max-messages-per-poll=10
spring.cloud.aws.sqs.listener.max-inflight-messages-per-queue=40

# Listener concurrency for @SqsListener
app.sqs.max-concurrent-messages=10

# To run with this profile:
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
# or
#   java -jar target/sqsproject-0.0.1-SNAPSHOT.jar --spring.profiles.active=dev
