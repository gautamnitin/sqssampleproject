spring.application.name=internalapi

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/employeesdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# JPA batch settings for high performance
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Connection pool tuning
spring.datasource.hikari.maximum-pool-size=10

# jOOQ dialect
spring.jooq.sql-dialect=POSTGRES

# AWS SQS properties
app.sqs.region=us-east-1
# For LocalStack, uncomment and set endpoint
app.sqs.endpoint=http://localhost:4566
app.sqs.employee-queue=employee-queue

# SQS listener performance tuning (requires awspring-cloud-sqs 3.x)
spring.cloud.aws.sqs.listener.max-messages-per-poll=10
spring.cloud.aws.sqs.listener.max-inflight-messages-per-queue=40

# Listener concurrency for @SqsListener
app.sqs.max-concurrent-messages=10
