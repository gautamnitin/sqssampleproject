spring.application.name=internalapi

# H2 datasource
spring.datasource.url=jdbc:h2:mem:employeesdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# JPA batch settings for high performance
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Connection pool tuning
spring.datasource.hikari.maximum-pool-size=10

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AWS SQS properties
app.sqs.region=us-east-1
# For LocalStack, uncomment and set endpoint
app.sqs.endpoint=http://localhost:4566
app.sqs.employee-queue=employee-queue

# SQS listener performance tuning (requires awspring-cloud-sqs 3.x)
spring.cloud.aws.sqs.listener.max-messages-per-poll=10
spring.cloud.aws.sqs.listener.max-inflight-messages-per-queue=40

# Listener concurrency for @SqsListener
app.sqs.max-concurrent-messages=10
